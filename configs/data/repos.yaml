# Repositories used to build benchmarks and training data. Cloned by `scripts/prepare_dataset.py clone`.
#
# role: eval  -> held out. Issue/commit localization and docstring benchmarks; never mined for training pairs.
# role: train -> mined for training pairs (commits strictly before the training cutoff; issue pairs from any date).
#                A repository may not appear under more than one role (checked by URL).
# license: SPDX expression, required for every repo and recorded in repos.lock.json. Train repos must be
#          permissive (codeintel.data.licenses.PERMISSIVE); `pairs` checks the declaration against the licence
#          files at every mined revision and skips the repo or commit on any mismatch.
#
# role: dev   -> held out from training and evaluation; used only to choose settings (fusion weight, interpolation).
#
# Evaluation issues are taken from 2025-03-01 onwards. Very large monorepos are avoided to keep indexing cheap.
shallow_since: "2025-01-01"
repos:
  # Python
  - {name: pytest, url: https://github.com/pytest-dev/pytest, language: python, license: MIT, role: eval}
  - {name: pip, url: https://github.com/pypa/pip, language: python, license: MIT, role: eval}
  - {name: textual, url: https://github.com/Textualize/textual, language: python, license: MIT, role: eval}
  - {name: mypy, url: https://github.com/python/mypy, language: python, license: MIT AND PSF-2.0, role: eval}
  - {name: conan, url: https://github.com/conan-io/conan, language: python, license: MIT, role: eval}
  - {name: scrapy, url: https://github.com/scrapy/scrapy, language: python, license: BSD-3-Clause, role: eval}
  - {name: xarray, url: https://github.com/pydata/xarray, language: python, license: Apache-2.0, role: eval}
  - {name: pydantic, url: https://github.com/pydantic/pydantic, language: python, license: MIT, role: eval}
  - {name: pylint, url: https://github.com/pylint-dev/pylint, language: python, license: GPL-2.0-or-later, role: eval}
  - {name: celery, url: https://github.com/celery/celery, language: python, license: BSD-3-Clause, role: eval}
  - {name: beets, url: https://github.com/beetbox/beets, language: python, license: MIT, role: eval}
  - {name: tox, url: https://github.com/tox-dev/tox, language: python, license: MIT, role: eval}
  - {name: scikit-learn, url: https://github.com/scikit-learn/scikit-learn, language: python, license: BSD-3-Clause, role: eval}
  - {name: astropy, url: https://github.com/astropy/astropy, language: python, license: BSD-3-Clause, role: eval}
  - {name: matplotlib, url: https://github.com/matplotlib/matplotlib, language: python, license: LicenseRef-Matplotlib, role: eval}
  - {name: networkx, url: https://github.com/networkx/networkx, language: python, license: BSD-3-Clause, role: eval}
  - {name: black, url: https://github.com/psf/black, language: python, license: MIT, role: eval}
  - {name: ipython, url: https://github.com/ipython/ipython, language: python, license: BSD-3-Clause, role: eval}
  - {name: sympy, url: https://github.com/sympy/sympy, language: python, license: LicenseRef-SymPy, role: eval}
