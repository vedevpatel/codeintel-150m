[project]
name = "codeintel"
version = "0.1.0"
description = "Compact code embedding model: semantic code search, issue-to-code localization, repository navigation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10,<3.14"
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
    "torch>=2.3",
    "transformers>=4.48",
    "safetensors>=0.4",
    "huggingface-hub>=0.24",
    # Imported by CodeRankEmbed's reviewed remote modeling code.
    "einops>=0.7",
    "tree-sitter>=0.23",
    "tree-sitter-typescript>=0.23",
]

[project.optional-dependencies]
# Extra tree-sitter grammars; languages without an installed grammar fall back to line-window chunking.
languages = [
    "tree-sitter-java>=0.23",
    "tree-sitter-go>=0.23",
    "tree-sitter-rust>=0.23",
]
onnx = [
    "onnx>=1.16",
    "onnxruntime>=1.18",
]
datasets = [
    "datasets>=2.19",
]
dev = [
    "pytest>=8",
    "ruff>=0.5",
]

[project.scripts]
codeintel = "codeintel.cli:main"

[build-system]
requires = ["hatchling>=1.27"]  # PEP 639 license / license-files
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codeintel"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
norecursedirs = ["tests/fixtures"]
markers = [
    "network: test downloads model weights from the Hugging Face Hub (deselect with -m 'not network')",
]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501", "B905"]
